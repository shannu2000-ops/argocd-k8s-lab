apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment
  labels:
    app: ecommerce
    tier: backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ecommerce
      tier: backend

  template:
    metadata:
      labels:
        app: ecommerce
        tier: backend

    spec:
      containers:
        - name: backend
          image: nginx:latest
          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:i
                 name: backend-config    
            - secretRef:
                  name: backend-secret       
